# Nginx как обратный прокси перед приложением.
# Приложение слушает только 127.0.0.1:8000, наружу отдаёт Nginx с HTTPS.
#
# 1) получите сертификат:  certbot --nginx -d vitrina.example.ru
# 2) положите этот файл в /etc/nginx/sites-available/vitrina
# 3) ln -s /etc/nginx/sites-available/vitrina /etc/nginx/sites-enabled/vitrina
# 4) nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name vitrina.example.ru;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 1h;
    }
}
