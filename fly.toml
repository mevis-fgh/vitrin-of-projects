# Деплой на Fly.io (https://fly.io).
# Перед первым запуском создайте том для базы данных:
#   fly volumes create vitrina_data --size 1 --region ams
app = "vitrina-it"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  DATA_DIR = "/data"
  DEMO_MODE = "1"
  COOKIE_SECURE = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "vitrina_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
