services:
  vitrina:
    build: .
    image: vitrina-it:1.0.0
    container_name: vitrina
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      DATA_DIR: "/data"
      DEMO_MODE: "${DEMO_MODE:-1}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin12345!}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-12}"
      # Включите, когда сайт работает по HTTPS:
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - vitrina-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vitrina-data:
